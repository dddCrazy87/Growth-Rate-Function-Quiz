<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漸進函數成長速度排序練習</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 64rem;
            margin: 0 auto;
        }

        .title {
            font-size: 2.25rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #312e81;
        }

        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .control-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .label {
            font-weight: 600;
            color: #374151;
        }

        .input-number {
            border: 2px solid #d1d5db;
            border-radius: 0.25rem;
            padding: 0.5rem 0.75rem;
            width: 5rem;
            font-size: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-success {
            background: #16a34a;
            color: white;
            padding: 0.75rem 1.5rem;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn-secondary {
            background: #4b5563;
            color: white;
            padding: 0.75rem 1.5rem;
        }

        .btn-secondary:hover {
            background: #374151;
        }

        .functions-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .function-item {
            background: linear-gradient(to right, #eef2ff, #dbeafe);
            border: 2px solid #c7d2fe;
            padding: 1rem;
            border-radius: 0.5rem;
            cursor: move;
            transition: all 0.2s;
            user-select: none;
        }

        .function-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .function-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .function-item.error {
            border-color: #f87171;
            background: #fef2f2;
        }

        .function-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .function-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4f46e5;
            min-width: 2.5rem;
        }

        .function-text {
            flex: 1;
        }

        .function-latex {
            font-size: 1.25rem;
        }

        .function-category {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        .function-rank {
            font-size: 0.875rem;
            color: #4b5563;
            background: #f3f4f6;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .result-success {
            background: #dcfce7;
            border: 2px solid #86efac;
        }

        .result-warning {
            background: #fef3c7;
            border: 2px solid #fde047;
        }

        .result-text {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .instructions-list {
            list-style-position: inside;
            color: #374151;
        }

        .instructions-list li {
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        svg {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Shuffle = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
            </svg>
        );

        const Check = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M20 6L9 17l-5-5" />
            </svg>
        );

        const RotateCcw = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
        );

        const GrowthRateQuiz = () => {
            const functions = [
                { latex: 'n^{2^n}', category: '指數又是指數', rank: 1 },
                { latex: '2^{2^{n+1}}', category: '指數又是指數', rank: 2 },
                { latex: '2^{2^n}', category: '指數又是指數', rank: 3 },
                { latex: 'n^n', category: '階乘', rank: 4 },
                { latex: '(n+1)!', category: '階乘', rank: 5 },
                { latex: 'n!', category: '階乘', rank: 6 },
                { latex: '(\\lg n)^n', category: '階乘', rank: 7 },
                { latex: 'e^n', category: '指數', rank: 8 },
                { latex: 'n \\cdot 2^n', category: '指數', rank: 9 },
                { latex: 'd^n, d>2', category: '指數', rank: 10 },
                { latex: '2^n', category: '指數', rank: 11 },
                { latex: '(\\frac{3}{2})^n', category: '指數', rank: 12 },
                { latex: '(1.0001)^n', category: '指數', rank: 13 },
                { latex: '(\\lg n)^{\\lg n} = n^{\\lg \\lg n}', category: '特殊', rank: 14 },
                { latex: '(\\lg n)!', category: '特殊', rank: 15 },
                { latex: 'n^d, d > 0', category: '多項式', rank: 16 },
                { latex: 'n^3', category: '多項式', rank: 17 },
                { latex: 'n^2 = 4^{\\lg n}', category: '多項式', rank: 18 },
                { latex: 'n \\lg n', category: '多項式', rank: 19 },
                { latex: '\\lg(n!)', category: '多項式', rank: 20 },
                { latex: 'n = 2^{\\lg n}', category: '多項式', rank: 21 },
                { latex: '(\\sqrt{2})^{\\lg n} = \\sqrt{n}', category: '多項式', rank: 22 },
                { latex: 'n^{0.001}', category: '多項式', rank: 23 },
                { latex: '2^{\\sqrt{2 \\lg n}}', category: '多項式', rank: 24 },
                { latex: '(\\lg \\lg n)!', category: '對數', rank: 25 },
                { latex: '\\lg^2 n', category: '對數', rank: 26 },
                { latex: '\\lg n = \\ln n', category: '對數', rank: 27 },
                { latex: '\\lg(n^d), d > 0', category: '對數', rank: 28 },
                { latex: '2^{\\sqrt{\\lg \\lg n}}', category: '對數', rank: 29 },
                { latex: '\\sqrt{\\lg n} = \\sqrt{2}^{\\lg \\lg n}', category: '對數', rank: 30 },
                { latex: '\\lg \\lg n = \\ln \\ln n', category: '對數', rank: 31 },
                { latex: '2^{\\lg^* n}', category: '對數', rank: 32 },
                { latex: '\\lg^* n', category: '對數', rank: 33 },
                { latex: '\\lg^*(\\lg n)', category: '對數', rank: 34 },
                { latex: '\\lg(\\lg^* n)', category: '對數', rank: 35 },
                { latex: 'O(1) = n^{\\frac{1}{\\lg n}} = 2', category: '常數', rank: 36 }
            ];

            const [numFunctions, setNumFunctions] = useState(5);
            const [selectedFunctions, setSelectedFunctions] = useState([]);
            const [userOrder, setUserOrder] = useState([]);
            const [showAnswer, setShowAnswer] = useState(false);
            const [draggedIndex, setDraggedIndex] = useState(null);

            useEffect(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            }, [userOrder, showAnswer]);

            const generateQuiz = () => {
                const shuffled = [...functions].sort(() => Math.random() - 0.5);
                const selected = shuffled.slice(0, numFunctions);
                setSelectedFunctions(selected);
                setUserOrder([...selected]);
                setShowAnswer(false);
            };

            useEffect(() => {
                generateQuiz();
            }, []);

            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === index) return;

                const newOrder = [...userOrder];
                const draggedItem = newOrder[draggedIndex];
                newOrder.splice(draggedIndex, 1);
                newOrder.splice(index, 0, draggedItem);

                setUserOrder(newOrder);
                setDraggedIndex(index);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDraggedIndex(null);
            };

            const handleDragEnd = () => {
                setDraggedIndex(null);
            };

            const checkAnswer = () => {
                setShowAnswer(true);
            };

            const isCorrect = () => {
                if (!showAnswer) return null;
                for (let i = 0; i < userOrder.length - 1; i++) {
                    if (userOrder[i].rank > userOrder[i + 1].rank) {
                        return false;
                    }
                }
                return true;
            };

            return (
                <div className="container">
                    <h1 className="title">漸進函數成長速度排序練習</h1>
                    <p className="subtitle">將函數從成長最快排到最慢（拖曳排序）</p>

                    <div className="card">
                        <div className="control-bar">
                            <label className="label">選擇函數數量：</label>
                            <input
                                type="number"
                                min="2"
                                max={functions.length}
                                value={numFunctions}
                                onChange={(e) => setNumFunctions(Math.max(2, Math.min(functions.length, parseInt(e.target.value) || 5)))}
                                className="input-number"
                            />
                            <button onClick={generateQuiz} className="btn btn-primary">
                                <Shuffle />
                                重新生成
                            </button>
                        </div>

                        <div className="functions-list">
                            {userOrder.map((func, index) => (
                                <div
                                    key={`${func.latex}-${index}`}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, index)}
                                    onDragOver={(e) => handleDragOver(e, index)}
                                    onDragEnd={handleDragEnd}
                                    onDrop={handleDrop}
                                    className={`function-item ${draggedIndex === index ? 'dragging' : ''} ${showAnswer && userOrder[index].rank !== selectedFunctions.sort((a, b) => a.rank - b.rank)[index].rank ? 'error' : ''
                                        }`}
                                >
                                    <div className="function-content">
                                        <span className="function-number">{index + 1}</span>
                                        <div className="function-text">
                                            <div className="function-latex">{`\\(${func.latex}\\)`}</div>
                                            {showAnswer && <div className="function-category">{func.category}</div>}
                                        </div>
                                        {showAnswer && <span className="function-rank">排名: {func.rank}</span>}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="button-group">
                            <button onClick={checkAnswer} className="btn btn-success">
                                <Check />
                                檢查答案
                            </button>
                            <button
                                onClick={() => {
                                    setUserOrder([...selectedFunctions]);
                                    setShowAnswer(false);
                                }}
                                className="btn btn-secondary"
                            >
                                <RotateCcw />
                                重置排序
                            </button>
                        </div>

                        {showAnswer && (
                            <div className={`result-box ${isCorrect() ? 'result-success' : 'result-warning'}`}>
                                <p className="result-text">
                                    {isCorrect() ? '🎉 完全正確！' : '❌ 還有錯誤，請參考正確排名'}
                                </p>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <h2 className="section-title">使用說明</h2>
                        <ul className="instructions-list">
                            <li>拖曳函數卡片來調整順序（從上到下：快→慢）</li>
                            <li>可以選擇要練習的函數數量</li>
                            <li>點擊「檢查答案」查看結果</li>
                            <li>錯誤的位置會用紅色標示</li>
                        </ul>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<GrowthRateQuiz />, document.getElementById('root'));
    </script>
</body>

</html>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;

        // ===== 資料 =====
        const CATEGORIES = [
            { id: 'dexp', name: '指數的指數（double exponential）' },
            { id: 'fact', name: '階乘（factorial）' },
            { id: 'exp', name: '指數（exponential）' },
            { id: 'subexp', name: '次指數（subexponential）' },
            { id: 'quasi', name: '準多項式（quasi-polynomial）' },
            { id: 'poly', name: '多項式（polynomial）' },
            { id: 'between', name: '對數與多項式之間（superpolylogarithmic, subpolynomial）' },
            { id: 'log', name: '對數（logarithmic）' },
            { id: 'const', name: '常數（constant）' }
        ];
        const CATEGORY_NAME = Object.fromEntries(CATEGORIES.map(c => [c.id, c.name]));

        // 每一項是一個等級，由成長最快排到最慢
        // cards：同級的函數，各自拆成一張卡片；note：函數總表中的寫法（省略時與唯一的卡片相同）
        const TIERS = [
            { cat: 'dexp', cards: ['n^{2^n}'] },
            { cat: 'dexp', cards: ['2^{2^{n+1}}'] },
            { cat: 'dexp', cards: ['2^{2^n}'] },
            { cat: 'fact', cards: ['n^n'] },
            { cat: 'fact', cards: ['(n+1)!'] },
            { cat: 'fact', cards: ['n!'] },
            { cat: 'fact', cards: ['(\\lg n)^n'] },
            { cat: 'exp', cards: ['d^n,\\ d>2'], note: '\\(d^n,\\ d>2\\) constant' },
            { cat: 'exp', cards: ['n \\cdot 2^n'] },
            { cat: 'exp', cards: ['2^n'] },
            { cat: 'exp', cards: ['(1.0001)^n'] },
            { cat: 'subexp', cards: ['2^{\\sqrt{n}}'] },
            { cat: 'quasi', cards: ['n^{\\lg n}', '2^{\\lg^2 n}'], note: '\\(n^{\\lg n} = 2^{\\lg^2 n}\\)' },
            { cat: 'quasi', cards: ['(\\lg n)^{\\lg n}', 'n^{\\lg \\lg n}'], note: '\\((\\lg n)^{\\lg n} = n^{\\lg \\lg n}\\)' },
            { cat: 'quasi', cards: ['(\\lg n)!'] },
            { cat: 'poly', cards: ['n^d,\\ d>2'], note: '\\(n^d,\\ d>2\\) constant' },
            { cat: 'poly', cards: ['n^2', '4^{\\lg n}'], note: '\\(n^2 = 4^{\\lg n}\\)' },
            { cat: 'poly', cards: ['n \\lg n', '\\lg(n!)'], note: '\\(n \\lg n =_{\\text{稍微大於}} \\lg(n!)\\)' },
            { cat: 'poly', cards: ['n', '2^{\\lg n}'], note: '\\(n = 2^{\\lg n}\\)' },
            { cat: 'poly', cards: ['(\\sqrt{2})^{\\lg n}', '\\sqrt{n}'], note: '\\((\\sqrt{2})^{\\lg n} = \\sqrt{n}\\)' },
            { cat: 'poly', cards: ['n^{0.001}'] },
            { cat: 'between', cards: ['2^{\\sqrt{2 \\lg n}}'] },
            { cat: 'between', cards: ['(\\lg \\lg n)!'] },
            { cat: 'log', cards: ['\\lg^k n,\\ k>1'], note: '\\(\\lg^k n,\\ k>1\\) constant' },
            {
                cat: 'log',
                cards: ['\\lg n', '\\ln n', '\\lg(n^d),\\ d>0', '2^{\\lg \\lg n}'],
                note: '\\(\\lg n = \\ln n = \\lg(n^d) = 2^{\\lg \\lg n}\\)，\\(d\\) is positive constant'
            },
            { cat: 'log', cards: ['\\sqrt{\\lg n}', '\\sqrt{2}^{\\lg \\lg n}'], note: '\\(\\sqrt{\\lg n} = \\sqrt{2}^{\\lg \\lg n}\\)' },
            { cat: 'log', cards: ['2^{\\sqrt{\\lg \\lg n}}'] },
            { cat: 'log', cards: ['\\lg \\lg n', '\\ln \\ln n'], note: '\\(\\lg \\lg n = \\ln \\ln n\\)' },
            { cat: 'log', cards: ['2^{\\lg^* n}'] },
            { cat: 'log', cards: ['\\lg^* n', '\\lg^*(\\lg n)'], note: '\\(\\lg^* n =_{\\text{稍微大於}} \\lg^*(\\lg n)\\)' },
            { cat: 'log', cards: ['\\lg(\\lg^* n)'] },
            { cat: 'const', cards: ['1', 'n^{\\frac{1}{\\lg n}}'], note: '\\(O(1) = n^{\\frac{1}{\\lg n}}\\ (= 2)\\)' }
        ];

        const TIER_LIST = TIERS.map((t, i) => ({ ...t, rank: i + 1, note: t.note || `\\(${t.cards[0]}\\)` }));
        const CARDS = TIER_LIST.flatMap(t => t.cards.map((latex, j) => ({ id: `${t.rank}-${j}`, latex, rank: t.rank, cat: t.cat })));
        const CARD_BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
        const MIN_COUNT = 2;
        const DEFAULT_COUNT = 5;

        // ===== 工具函式 =====
        // Fisher–Yates 洗牌（每種排列機率相同）
        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const groupIndexOf = (groups, id) => groups.findIndex(g => g.includes(id));

        // target：{ type: 'insert', index }（插在第 index 列之前，自成一列）或 { type: 'merge', index }（疊進第 index 列）
        const isNoop = (groups, id, target) => {
            if (!target) return true;
            const from = groupIndexOf(groups, id);
            if (target.type === 'merge') return target.index === from;
            return groups[from].length === 1 && (target.index === from || target.index === from + 1);
        };

        const moveCard = (groups, id, target) => {
            const g = groups.map(x => [...x]);
            const from = groupIndexOf(g, id);
            g[from] = g[from].filter(x => x !== id);
            let index = target.index;
            if (g[from].length === 0) {
                g.splice(from, 1);
                if (from < index) index -= 1;
            }
            if (target.type === 'insert') g.splice(index, 0, [id]);
            else g[index].push(id);
            return g;
        };

        // 找出「不用動」的最大卡片集合，其餘卡片標為需要移動
        // 每一列最多保留一個等級的卡片，且保留的等級必須由上到下嚴格遞增
        const evaluate = (groups) => {
            const options = [];
            groups.forEach((grp, g) => {
                const byRank = new Map();
                grp.forEach(id => {
                    const r = CARD_BY_ID[id].rank;
                    if (!byRank.has(r)) byRank.set(r, []);
                    byRank.get(r).push(id);
                });
                byRank.forEach((ids, r) => options.push({ g, r, ids }));
            });

            const score = options.map(o => o.ids.length);
            const prev = options.map(() => -1);
            for (let i = 0; i < options.length; i++) {
                for (let j = 0; j < i; j++) {
                    if (options[j].g < options[i].g && options[j].r < options[i].r && score[j] + options[i].ids.length > score[i]) {
                        score[i] = score[j] + options[i].ids.length;
                        prev[i] = j;
                    }
                }
            }
            let best = 0;
            for (let i = 1; i < options.length; i++) if (score[i] > score[best]) best = i;

            const keep = new Set();
            for (let i = best; i >= 0; i = prev[i]) options[i].ids.forEach(id => keep.add(id));

            const all = groups.flat();
            const wrong = new Set(all.filter(id => !keep.has(id)));
            const ranks = [...new Set(all.map(id => CARD_BY_ID[id].rank))].sort((a, b) => a - b);
            const tierOf = new Map(ranks.map((r, k) => [r, k + 1]));
            const answer = ranks.map(r => all.filter(id => CARD_BY_ID[id].rank === r));

            const groupOf = new Map();
            groups.forEach((grp, g) => grp.forEach(id => groupOf.set(id, g)));
            const partnerOf = new Map();
            wrong.forEach(id => {
                const partner = all.find(o => o !== id && CARD_BY_ID[o].rank === CARD_BY_ID[id].rank && groupOf.get(o) !== groupOf.get(id));
                if (partner) partnerOf.set(id, partner);
            });

            return { wrong, tierOf, answer, partnerOf, correct: wrong.size === 0 };
        };

        // ===== MathJax =====
        let mathQueue = null;
        const typeset = (el) => {
            const MJ = window.MathJax;
            if (!MJ || !MJ.startup || !MJ.startup.promise) {
                el.classList.remove('mj-pending');
                return;
            }
            mathQueue = (mathQueue || MJ.startup.promise)
                .then(() => MJ.typesetPromise([el]))
                .catch(err => console.error(err))
                .then(() => el.classList.remove('mj-pending'));
        };

        // src 內用 \( \) 包住數學式；元素內容由 MathJax 管理，不交給 React
        const MathText = React.memo(({ src, className }) => {
            const ref = useRef(null);
            useLayoutEffect(() => {
                const el = ref.current;
                el.textContent = src;
                el.classList.add('mj-pending');
                typeset(el);
                return () => {
                    const MJ = window.MathJax;
                    if (MJ && MJ.typesetClear) {
                        try { MJ.typesetClear([el]); } catch (e) { /* 忽略 */ }
                    }
                };
            }, [src]);
            return <span ref={ref} className={className} />;
        });

        const cardTex = (id) => `\\(${CARD_BY_ID[id].latex}\\)`;

        // ===== 圖示 =====
        const Shuffle = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
            </svg>
        );

        const Check = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M20 6L9 17l-5-5" />
            </svg>
        );

        const RotateCcw = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
        );

        const Grip = () => (
            <svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor" aria-hidden="true">
                <circle cx="4" cy="4" r="1.6" /><circle cx="10" cy="4" r="1.6" />
                <circle cx="4" cy="10" r="1.6" /><circle cx="10" cy="10" r="1.6" />
                <circle cx="4" cy="16" r="1.6" /><circle cx="10" cy="16" r="1.6" />
            </svg>
        );

        // ===== 卡片 =====
        const Chip = ({ id, selected, dragSource, result, onPointerDown, onActivate, focusRef }) => {
            const card = CARD_BY_ID[id];
            const ref = useRef(null);
            const wrong = result && result.wrong.has(id);
            const partner = result && result.partnerOf.get(id);

            useEffect(() => {
                if (focusRef.current === id && ref.current) {
                    focusRef.current = null;
                    ref.current.focus({ preventScroll: true });
                }
            });

            return (
                <div
                    ref={ref}
                    className={`chip${selected ? ' selected' : ''}${dragSource ? ' drag-source' : ''}${wrong ? ' error' : ''}`}
                    role="button"
                    tabIndex={0}
                    aria-pressed={selected}
                    onPointerDown={(e) => onPointerDown(e, id)}
                    onClick={() => onActivate(id)}
                    onKeyDown={(e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            onActivate(id);
                        }
                    }}
                >
                    <span className="handle" aria-hidden="true"><Grip /></span>
                    <span className="chip-body">
                        <MathText className="chip-math" src={`\\(${card.latex}\\)`} />
                        {result && (
                            <span className="chip-meta">正確：第 {result.tierOf.get(card.rank)} 級｜{CATEGORY_NAME[card.cat]}</span>
                        )}
                        {wrong && partner && (
                            <span className="chip-hint">應與 <MathText src={cardTex(partner)} /> 疊在一起</span>
                        )}
                    </span>
                </div>
            );
        };

        // ===== 函數總表 =====
        const NotesView = () => (
            <section className="card" aria-label="函數總表">
                <p className="notes-summary">
                    共 {CARDS.length} 個函數、{TIER_LIST.length} 個等級，由上到下成長由快到慢，同一行為同級。
                </p>
                {CATEGORIES.map(cat => (
                    <div className="notes-group" key={cat.id}>
                        <h3>{cat.name}</h3>
                        <ul>
                            {TIER_LIST.filter(t => t.cat === cat.id).map(t => (
                                <li key={t.rank}><MathText className="notes-math" src={t.note} /></li>
                            ))}
                        </ul>
                    </div>
                ))}
            </section>
        );

        // ===== 主程式 =====
        const GrowthRateQuiz = () => {
            const total = CARDS.length;
            const [tab, setTab] = useState('practice');
            const [count, setCount] = useState(DEFAULT_COUNT);
            const [countText, setCountText] = useState(String(DEFAULT_COUNT));
            const [initialGroups, setInitialGroups] = useState([]);
            const [groups, setGroups] = useState([]);
            const [showAnswer, setShowAnswer] = useState(false);
            const [selectedId, setSelectedId] = useState(null);
            const [draggingId, setDraggingId] = useState(null);
            const [dropTarget, setDropTarget] = useState(null);

            const listRef = useRef(null);
            const dragRef = useRef(null);
            const targetRef = useRef(null);
            const suppressClickRef = useRef(false);
            const focusRef = useRef(null);
            const latest = useRef({});

            const generate = (n) => {
                const picked = shuffle(CARDS).slice(0, n);
                const start = picked.map(c => [c.id]);
                setInitialGroups(start);
                setGroups(start);
                setShowAnswer(false);
                setSelectedId(null);
            };

            const commitCount = (n) => {
                const v = Math.max(MIN_COUNT, Math.min(total, Number.isFinite(n) ? n : count));
                setCount(v);
                setCountText(String(v));
                generate(v);
            };

            const applyMove = (id, target) => {
                if (isNoop(latest.current.groups, id, target)) return;
                setGroups(g => (isNoop(g, id, target) ? g : moveCard(g, id, target)));
                setShowAnswer(false);
            };

            latest.current = { groups, selectedId, applyMove, clearSelection: () => setSelectedId(null) };

            useEffect(() => {
                generate(DEFAULT_COUNT);
            }, []);

            // ----- 拖曳（滑鼠、觸控、觸控筆共用 pointer events） -----
            useEffect(() => {
                const computeTarget = (y) => {
                    const d = dragRef.current;
                    const list = listRef.current;
                    if (!d || !list) return null;
                    const rows = [...list.querySelectorAll('[data-row]')];
                    let t = null;
                    for (let i = 0; i < rows.length; i++) {
                        const r = rows[i].getBoundingClientRect();
                        if (y < r.top) { t = { type: 'insert', index: i }; break; }
                        if (y <= r.bottom) {
                            const edge = Math.min(r.height * 0.25, 16);
                            if (y - r.top < edge) t = { type: 'insert', index: i };
                            else if (r.bottom - y < edge) t = { type: 'insert', index: i + 1 };
                            else t = { type: 'merge', index: i };
                            break;
                        }
                    }
                    if (!t) t = { type: 'insert', index: rows.length };
                    return isNoop(latest.current.groups, d.id, t) ? null : t;
                };

                const updateTarget = (t) => {
                    const prev = targetRef.current;
                    const same = (!prev && !t) || (prev && t && prev.type === t.type && prev.index === t.index);
                    if (!same) {
                        targetRef.current = t;
                        setDropTarget(t);
                    }
                };

                const endDrag = () => {
                    const d = dragRef.current;
                    if (d) {
                        if (d.ghost) d.ghost.remove();
                        if (d.raf) cancelAnimationFrame(d.raf);
                    }
                    dragRef.current = null;
                    targetRef.current = null;
                    document.body.classList.remove('is-dragging');
                    setDropTarget(null);
                    setDraggingId(null);
                };

                // 拖到視窗上下緣時自動捲動
                const autoScroll = () => {
                    const d = dragRef.current;
                    if (!d || !d.active) return;
                    const edge = 70;
                    let dy = 0;
                    if (d.lastY < edge) dy = -Math.ceil((edge - d.lastY) / 5);
                    else if (d.lastY > window.innerHeight - edge) dy = Math.ceil((d.lastY - (window.innerHeight - edge)) / 5);
                    if (dy !== 0) {
                        window.scrollBy(0, dy);
                        updateTarget(computeTarget(d.lastY));
                    }
                    d.raf = requestAnimationFrame(autoScroll);
                };

                const onMove = (e) => {
                    const d = dragRef.current;
                    if (!d || e.pointerId !== d.pointerId) return;
                    if (!d.active) {
                        if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 6) return;
                        d.active = true;
                        const rect = d.el.getBoundingClientRect();
                        const ghost = d.el.cloneNode(true);
                        ghost.classList.remove('selected', 'error');
                        ghost.classList.add('ghost');
                        ghost.setAttribute('aria-hidden', 'true');
                        ghost.removeAttribute('tabindex');
                        ghost.style.left = `${rect.left}px`;
                        ghost.style.top = `${rect.top}px`;
                        ghost.style.width = `${rect.width}px`;
                        document.body.appendChild(ghost);
                        d.ghost = ghost;
                        document.body.classList.add('is-dragging');
                        latest.current.clearSelection();
                        setDraggingId(d.id);
                        d.raf = requestAnimationFrame(autoScroll);
                    }
                    e.preventDefault();
                    d.lastY = e.clientY;
                    d.ghost.style.transform = `translate(${e.clientX - d.startX}px, ${e.clientY - d.startY}px)`;
                    updateTarget(computeTarget(e.clientY));
                };

                const onUp = (e) => {
                    const d = dragRef.current;
                    if (!d || e.pointerId !== d.pointerId) return;
                    if (!d.active) {
                        dragRef.current = null;
                        return;
                    }
                    const t = computeTarget(e.clientY);
                    const id = d.id;
                    endDrag();
                    suppressClickRef.current = true;
                    setTimeout(() => { suppressClickRef.current = false; }, 0);
                    if (t) latest.current.applyMove(id, t);
                };

                const onCancel = (e) => {
                    const d = dragRef.current;
                    if (d && e.pointerId === d.pointerId) endDrag();
                };

                const onKey = (e) => {
                    if (e.key !== 'Escape') return;
                    if (dragRef.current && dragRef.current.active) endDrag();
                    latest.current.clearSelection();
                };

                window.addEventListener('pointermove', onMove, { passive: false });
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onCancel);
                window.addEventListener('keydown', onKey);
                return () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onCancel);
                    window.removeEventListener('keydown', onKey);
                };
            }, []);

            const onChipPointerDown = (e, id) => {
                if (e.button !== 0 || dragRef.current) return;
                // 觸控時只從握把拖曳，其他地方保留給捲動頁面
                if (e.pointerType !== 'mouse' && !e.target.closest('.handle')) return;
                dragRef.current = { id, el: e.currentTarget, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, lastY: e.clientY, active: false };
            };

            // 點選模式：點一張卡片選取，再點另一張卡片疊在一起，或點「移到這裡」移動
            const onChipActivate = (id) => {
                if (suppressClickRef.current) return;
                const sel = latest.current.selectedId;
                if (!sel) { setSelectedId(id); return; }
                if (sel === id) { setSelectedId(null); return; }
                const g = latest.current.groups;
                const to = groupIndexOf(g, id);
                if (to === groupIndexOf(g, sel)) { setSelectedId(id); return; }
                focusRef.current = sel;
                applyMove(sel, { type: 'merge', index: to });
                setSelectedId(null);
            };

            const result = useMemo(() => (showAnswer && groups.length ? evaluate(groups) : null), [showAnswer, groups]);

            const renderGap = (index) => {
                const active = dropTarget && dropTarget.type === 'insert' && dropTarget.index === index;
                const showButton = selectedId && !isNoop(groups, selectedId, { type: 'insert', index });
                return (
                    <div className={`gap${active ? ' active' : ''}`} key={`gap-${index}`}>
                        {showButton && (
                            <button
                                className="gap-btn"
                                onClick={() => {
                                    focusRef.current = selectedId;
                                    applyMove(selectedId, { type: 'insert', index });
                                    setSelectedId(null);
                                }}
                            >
                                移到這裡
                            </button>
                        )}
                    </div>
                );
            };

            return (
                <div className="container">
                    <h1 className="title">漸進函數成長速度排序練習</h1>
                    <p className="subtitle">將函數從成長最快排到最慢，同級的函數疊在同一列</p>

                    <div className="tabs" role="tablist" aria-label="檢視">
                        <button role="tab" className="tab" aria-selected={tab === 'practice'} onClick={() => setTab('practice')}>排序練習</button>
                        <button role="tab" className="tab" aria-selected={tab === 'list'} onClick={() => setTab('list')}>函數總表</button>
                    </div>

                    <section hidden={tab !== 'practice'}>
                        <div className="card">
                            <div className="control-bar">
                                <span className="label" id="count-label">函數數量</span>
                                <div className="stepper">
                                    <button className="stepper-btn" aria-label="減少一個" disabled={count <= MIN_COUNT} onClick={() => commitCount(count - 1)}>−</button>
                                    <input
                                        className="input-number"
                                        type="text"
                                        inputMode="numeric"
                                        aria-labelledby="count-label"
                                        value={countText}
                                        onChange={(e) => setCountText(e.target.value.replace(/[^0-9]/g, ''))}
                                        onBlur={() => {
                                            const n = parseInt(countText, 10);
                                            if (!Number.isFinite(n)) setCountText(String(count));
                                            else if (n !== count) commitCount(n);
                                        }}
                                        onKeyDown={(e) => {
                                            if (e.key !== 'Enter') return;
                                            const n = parseInt(countText, 10);
                                            if (Number.isFinite(n)) commitCount(n);
                                            else setCountText(String(count));
                                        }}
                                    />
                                    <button className="stepper-btn" aria-label="增加一個" disabled={count >= total} onClick={() => commitCount(count + 1)}>+</button>
                                </div>
                                <span className="total">／ 共 <strong>{total}</strong> 個函數</span>
                                <button className="btn btn-light" onClick={() => commitCount(total)}>全部</button>
                                <button className="btn btn-primary" onClick={() => generate(count)}>
                                    <Shuffle />
                                    重新出題
                                </button>
                            </div>

                            <p className="hint">由上到下：成長最快 → 最慢。拖曳卡片到兩列之間是移動，拖到某一列上是疊在一起（同級）。</p>

                            {selectedId && (
                                <p className="select-hint" role="status">
                                    已選取 <MathText src={cardTex(selectedId)} />：點另一張卡片疊在一起，或點「移到這裡」移動；再點一次或按 Esc 取消。
                                </p>
                            )}

                            <div className="rows" ref={listRef}>
                                {renderGap(0)}
                                {groups.map((grp, gi) => (
                                    <React.Fragment key={grp[0]}>
                                        <div
                                            data-row
                                            className={`row${dropTarget && dropTarget.type === 'merge' && dropTarget.index === gi ? ' merge-target' : ''}`}
                                        >
                                            <span className="row-number">{gi + 1}</span>
                                            <div className="chips">
                                                {grp.map(id => (
                                                    <Chip
                                                        key={id}
                                                        id={id}
                                                        selected={selectedId === id}
                                                        dragSource={draggingId === id}
                                                        result={result}
                                                        onPointerDown={onChipPointerDown}
                                                        onActivate={onChipActivate}
                                                        focusRef={focusRef}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                        {renderGap(gi + 1)}
                                    </React.Fragment>
                                ))}
                            </div>

                            <div className="button-group">
                                <button onClick={() => { setSelectedId(null); setShowAnswer(true); }} className="btn btn-success">
                                    <Check />
                                    檢查答案
                                </button>
                                <button
                                    onClick={() => {
                                        setGroups(initialGroups);
                                        setShowAnswer(false);
                                        setSelectedId(null);
                                    }}
                                    className="btn btn-secondary"
                                >
                                    <RotateCcw />
                                    重置排序
                                </button>
                            </div>

                            {result && (
                                <div className={`result-box ${result.correct ? 'result-success' : 'result-warning'}`} role="status">
                                    <p className="result-text">
                                        {result.correct
                                            ? '🎉 完全正確！'
                                            : `❌ 有 ${result.wrong.size} 張卡片需要移動（紅色標示），正確順序列在下方`}
                                    </p>
                                </div>
                            )}

                            {result && !result.correct && (
                                <div className="answer">
                                    <h2 className="section-title">正確順序</h2>
                                    <ol className="answer-list">
                                        {result.answer.map((ids, k) => (
                                            <li className="answer-item" key={ids[0]}>
                                                <span className="answer-number">{k + 1}</span>
                                                <span className="answer-chips">
                                                    {ids.map(id => (
                                                        <MathText key={id} className="answer-chip" src={cardTex(id)} />
                                                    ))}
                                                </span>
                                                <span className="answer-cat">{CATEGORY_NAME[CARD_BY_ID[ids[0]].cat]}</span>
                                            </li>
                                        ))}
                                    </ol>
                                </div>
                            )}
                        </div>

                        <div className="card">
                            <h2 className="section-title">使用說明</h2>
                            <ul className="instructions-list">
                                <li>把函數由上到下排成成長「最快 → 最慢」；同級的函數要疊在同一列</li>
                                <li>拖曳卡片：放在兩列之間是移動，放在某一列上是疊在一起；從疊好的列拖出來放到兩列之間即可拆開</li>
                                <li>手機請按住卡片左側的握把拖曳，卡片其他地方可以正常捲動頁面</li>
                                <li>也可以點一下卡片選取，再點另一張卡片疊在一起，或點「移到這裡」移動</li>
                                <li>點擊「檢查答案」後，需要移動的卡片會以紅色標示，並列出正確順序</li>
                            </ul>
                        </div>
                    </section>

                    {tab === 'list' && <NotesView />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GrowthRateQuiz />);
    </script>
</body>

</html>
